name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip and Fix Structure
        run: |
          if [ -f GTOOL-X-main.zip ]; then
            unzip -o GTOOL-X-main.zip -d temp_extracted
            cp -r temp_extracted/*/* . 2>/dev/null || cp -r temp_extracted/* . 2>/dev/null || true
            rm -rf temp_extracted
          fi
          if [ -f settings.gradle.kts ]; then
            sed -i 's/rootProject.name = .*/rootProject.name = "GtoolX"/' settings.gradle.kts
          elif [ -f settings.gradle ]; then
            sed -i 's/rootProject.name = .*/rootProject.name = "GtoolX"/' settings.gradle
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Latest Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --no-build-cache
          else
            gradle assembleDebug --no-daemon --no-build-cache
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
