name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip and Move Files
        run: |
          if [ -f GTOOL-X-main.zip ]; then
            unzip -o GTOOL-X-main.zip -d temp_extracted
            # Agar zip ke andar folder bana ho toh uski saari files bahar nikal lo
            cp -r temp_extracted/*/* . 2>/dev/null || cp -r temp_extracted/* . 2>/dev/null || true
            rm -rf temp_extracted
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build with Gradle
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
